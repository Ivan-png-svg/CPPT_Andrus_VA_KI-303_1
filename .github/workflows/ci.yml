name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Build and Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify -DbuildNumber=${{ github.run_number }}

      - name: Build and Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify -DbuildNumber=${{ github.run_number }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-catalog-jar-${{ matrix.os }}-build-${{ github.run_number }}
          path: target/*.jar
          if-no-files-found: error